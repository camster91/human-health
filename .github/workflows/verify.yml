name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ashbi-vps]
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          node -e "const p=require('./package.json'); if (process.version !== 'v22.16.0') throw new Error('Unexpected Node runtime: '+process.version); if (require('child_process').execSync('npm --version').toString().trim() !== '10.9.2') throw new Error('Unexpected npm runtime')"

      - name: Install dependencies
        # Switch to npm ci as soon as the reviewed package-lock.json is generated and committed.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: PWA static checks
        run: npm run check:pwa
